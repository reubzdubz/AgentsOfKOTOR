tasks:
  - name: Plan Mission
    description: Develop a detailed strategic plan to infiltrate the Sith Academy on Korriban, retrieve the ancient Mask of Darth Revan, and eliminate the Sith Master guarding it. Consider stealth options, combat strategies, potential Force-related challenges, and escape routes.
    agent: Kreia

  - name: Execute Plan
    description: Execute the infiltration plan with ruthless precision, adapting to any unforeseen obstacles encountered during the mission. Report on actions taken and outcomes achieved.
    agent: HK-47